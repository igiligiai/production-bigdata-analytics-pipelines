resources:
  # ====================================================================
  # CLUSTERS
  # ====================================================================
  
  clusters:
    dev_etl:
      cluster_name: "ecommerce-dev-etl-${variables.environment}"
      spark_version: "13.3.x-scala2.12"
      node_type_id: "${variables.cluster_config.dev.node_type}"
      driver_node_type_id: "${variables.cluster_config.dev.node_type}"
      num_workers: ${variables.cluster_config.dev.num_workers}
      autotermination_minutes: ${variables.cluster_config.dev.autotermination_minutes}
      
      aws_attributes:
        availability: "ON_DEMAND"
        zone_id: "us-west-2a"
      
      spark_conf:
        "spark.sql.shuffle.partitions": "100"
        "spark.databricks.delta.schema.autoMerge.enabled": "true"
        "spark.sql.adaptive.enabled": "true"
        "spark.sql.adaptive.skewJoin.enabled": "true"
        "spark.databricks.cluster.profile": "singleNode"
        "spark.sql.files.maxPartitionBytes": "1073741824"
      
      labels:
        env: "${variables.environment}"
        team: "data-engineering"
        purpose: "etl-pipeline"