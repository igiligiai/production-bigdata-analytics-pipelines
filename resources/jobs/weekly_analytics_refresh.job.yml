resources:
  jobs:
    weekly_analytics_refresh:
      name: Weekly Analytics Refresh
      description: "Runs deep analysis: CLV, churn prediction, market segmentation"
      
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "Europe/Berlin"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 7200
      
      tasks:
        - task_key: weekly_analytics
          existing_cluster_id: ${resources.clusters.prod_etl.id}
          notebook_task:
            notebook_path: ../../src/notebooks/adhoc/weekly_silver_analysis.py
          depends_on: []
