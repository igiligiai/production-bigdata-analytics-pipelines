resources:
  jobs:
    weekly_analytics_refresh:
      name: Weekly Analytics Refresh
      description: "Runs deep analysis: CLV, churn prediction, market segmentation"
      
      schedule:
        quartz_cron_expression: "0 2 * * 0"  # 2 AM Sunday
        timezone_id: "Europe/Berlin"
      
      max_concurrent_runs: 1
      timeout_seconds: 7200
      
      new_cluster:
        cluster_name: "ecommerce-analytics-weekly"
        spark_version: "13.3.x-scala2.12"
        node_type_id: "i3.2xlarge"
        num_workers: 6
        autotermination_minutes: 45
      
      tasks:
        - task_key: weekly_analytics
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/05_weekly_analysis"
          depends_on: []
