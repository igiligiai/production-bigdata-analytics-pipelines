# This is a Databricks asset bundle definition for production_bigdata_analytics_pipelines.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: production_bigdata_analytics_pipelines
  uuid: c54d4af5-1748-4f99-899b-852875a948b6

include:
  - resources/**/*.yml

variables:
  environment:
    description: Deployment environment (dev or prod)
    default: dev
  status:
    description: Job schedule status (PAUSED or UNPAUSED)
    default: PAUSED

  cluster_config:
    description: Cluster sizing and runtime configuration
    type: complex
    default:
      dev:
        node_type: Standard_DS3_v2
        num_workers: 1
        autotermination_minutes: 15
      prod:
        node_type: Standard_D4s_v3
        num_workers: 2
        autotermination_minutes: 10

  sql_warehouse_id:
    description: SQL Warehouse ID used by SQL alerts
    default: d31f81932da25bdc

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-1040672858755634.14.azuredatabricks.net
    variables:
      environment: dev
      status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://adb-1040672858755634.14.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/anthony.igiligi@sii-germany.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anthony.igiligi@sii-germany.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: prod
      status: UNPAUSED
